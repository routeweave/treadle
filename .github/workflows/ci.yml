name: CI

# Every pull request and every push to main runs the checks in test.yml, on
# OpenWrt 25.12 and against an upstream sing-box. Each run keeps its packages
# as an artifact for 30 days; that is what a snapshot is
# (scripts/push-to-router.sh installs the newest one of a branch).
#
# A push to main is also how a release happens. The Makefile's PKG_VERSION /
# PKG_RELEASE name the version most recently released, so when they name a
# version that has no v* tag yet, this commit is a release commit. The run
# then:
#   test     builds and tests that version (release: true), on 24.10 as well;
#   release  signs the apk those tests installed and creates the tag and the
#            release on this commit;
#   feed     indexes and signs that release as the package feed;
#   deploy   publishes the feed on GitHub Pages.
# Pages is deployed by release commits only, one deploy per commit.
#
# Run by hand with release_dry_run, it does all of that for the Makefile's
# version except publishing: the signed packages and the feed (built from the
# latest existing release) are kept as artifacts. That is how to test the
# release path on a branch.
#
# Pull requests cancel their own superseded runs. Runs on main queue
# instead: one may be releasing, and a release is never cut off halfway.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_dry_run:
        description: Build, test and sign the Makefile's version as a release, without publishing
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # tag is empty unless this run builds a release. The version is read from
  # the Makefile only: a tag is never the input, it is what a release creates.
  version:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.ver.outputs.tag }}
      version: ${{ steps.ver.outputs.version }}
      release: ${{ steps.ver.outputs.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: Makefile
          sparse-checkout-cone-mode: false

      - name: Is this a release?
        id: ver
        env:
          EVENT: ${{ github.event_name }}
          DRY_RUN: ${{ inputs.release_dry_run }}
        run: |
          mk_var() {
            awk -F':=' -v key="$1" \
              '$1 == key { sub(/^[ \t]+/, "", $2); sub(/[ \t]+$/, "", $2); print $2; exit }' \
              Makefile
          }
          VERSION=$(mk_var PKG_VERSION)
          RELEASE=$(mk_var PKG_RELEASE)
          [ -n "$VERSION" ] || { echo "::error::no PKG_VERSION in the Makefile"; exit 1; }
          case "$RELEASE" in
            [1-9]|[1-9][0-9]) ;;
            *) echo "::error::PKG_RELEASE is '$RELEASE', not a number from 1"; exit 1 ;;
          esac
          # docs/versioning.md: v0.1.0 for release 1, v0.1.0-r2 for a
          # packaging-only change to the same code.
          if [ "$RELEASE" = 1 ]; then TAG="v$VERSION"; else TAG="v$VERSION-r$RELEASE"; fi

          # Listed on every run, so a wrong bump fails its own pull request.
          # ls-remote exits non-zero when it cannot ask, so an unreachable
          # remote fails the run instead of reading as "no tags".
          tags=$(git ls-remote --tags --refs origin 'v[0-9]*') || { echo "::error::could not list the tags"; exit 1; }
          tags=$(printf '%s\n' "$tags" | sed -n 's|.*refs/tags/||p')

          if printf '%s\n' "$tags" | grep -qxF "$TAG"; then
            if [ "$EVENT:$DRY_RUN" != workflow_dispatch:true ]; then
              echo "not a release: $TAG is already released"
              exit 0
            fi
          else
            # A new version that sorts below the newest release is a typo in
            # the Makefile, not a release: routers would never upgrade to it.
            # sort -V puts v0.1.0 < v0.1.0-r2 < v0.1.0-r10 < v0.2.0.
            newest=$(printf '%s\n%s\n' "$tags" "$TAG" | sed '/^$/d' | sort -V | tail -n 1)
            if [ "$newest" != "$TAG" ]; then
              echo "::error::the Makefile names $TAG, which sorts below the newest release $newest"
              exit 1
            fi
            # A new PKG_VERSION starts again at PKG_RELEASE 1.
            last=$(printf '%s\n' "$tags" | sed '/^$/d' | sort -V | tail -n 1)
            last_version=${last#v}; last_version=${last_version%-r*}
            if [ "$VERSION" != "$last_version" ] && [ "$RELEASE" != 1 ]; then
              echo "::error::PKG_VERSION moves from $last_version to $VERSION, so PKG_RELEASE goes back to 1"
              exit 1
            fi
          fi

          case "$EVENT:$GITHUB_REF:$DRY_RUN" in
            push:refs/heads/main:*)
              echo "::notice::release commit: this run releases $TAG" ;;
            workflow_dispatch:*:true)
              echo "release dry run of $TAG" ;;
            *)
              echo "not a release: $EVENT on $GITHUB_REF ($TAG would be released on main)"
              exit 0 ;;
          esac
          echo "tag=$TAG"         >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "release=$RELEASE" >> "$GITHUB_OUTPUT"

  test:
    needs: version
    uses: ./.github/workflows/test.yml
    permissions:
      contents: read
      packages: read   # the test images
    with:
      release: ${{ needs.version.outputs.tag != '' }}
      # 24.10 is tested when it ships: on a release (and its dry run) and in
      # the weekly run. It is the only test of opkg and of the oldest
      # supported sing-box, which only 24.10 users run.
      primary_only: ${{ needs.version.outputs.tag == '' }}

  release:
    needs: [version, test]
    if: needs.version.outputs.tag != ''
    runs-on: ubuntu-24.04
    permissions:
      contents: write   # create the tag and the release
    env:
      DRY_RUN: ${{ github.event_name != 'push' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install apk-tools
        uses: ./.github/actions/install-apk-tools

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: packages-${{ github.sha }}
          path: dist/

      - name: Check the tested packages carry the release version
        env:
          FULL_VERSION: ${{ needs.version.outputs.version }}-r${{ needs.version.outputs.release }}
        run: |
          ls -l dist/
          for f in "dist/luci-app-treadle-${FULL_VERSION}.apk" \
                   "dist/luci-app-treadle_${FULL_VERSION}_all.ipk"; do
            [ -f "$f" ] || { echo "::error::$f is missing from the tested build"; exit 1; }
          done

      # The apk is signed with the feed key here, so the release asset and the
      # package the feed serves are the same bytes. --allow-untrusted: the
      # runner has no /etc/apk/keys, so apk cannot verify the signature it is
      # itself applying. Routers verify it.
      - name: Sign the apk with the feed key
        env:
          APK_SIGN_KEY: ${{ secrets.APK_SIGN_KEY }}
        run: |
          [ -n "$APK_SIGN_KEY" ] || { echo "::error::APK_SIGN_KEY secret is empty"; exit 1; }
          install -d -m 700 "$RUNNER_TEMP/keys"
          printf '%s\n' "$APK_SIGN_KEY" > "$RUNNER_TEMP/keys/apk.ec"
          chmod 600 "$RUNNER_TEMP/keys/apk.ec"
          ( cd dist && apk --allow-untrusted adbsign --sign-key "$RUNNER_TEMP/keys/apk.ec" ./*.apk )
          rm -rf "$RUNNER_TEMP/keys"
          for f in dist/*.apk; do sha256sum "$f" | awk '{print $1}' > "$f.sha256"; done

      - name: Keep the signed packages (dry run)
        if: env.DRY_RUN == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-dry-run
          path: dist/
          if-no-files-found: error

      # gh release create makes the tag on this commit together with the
      # release. Releases are immutable here, so creating one that exists
      # fails instead of touching it.
      - name: Publish the GitHub release
        if: env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.version.outputs.tag }}
          VERSION: ${{ needs.version.outputs.version }}
          RELEASE: ${{ needs.version.outputs.release }}
        run: |
          NOTES_FILE=$(mktemp)
          DL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}"
          # GitHub's own "What's Changed" list first, then the install
          # commands. The tag does not exist yet, so the notes are asked for
          # against this commit. A first release has nothing to diff against,
          # so fall back to a bare header rather than lose the commands.
          CHANGELOG=$(gh api -X POST \
            "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            -f tag_name="$TAG" -f target_commitish="$GITHUB_SHA" \
            --jq .body 2>/dev/null) || CHANGELOG=""
          [ -n "$CHANGELOG" ] || CHANGELOG="Release $TAG"
          printf '%s\n' "$CHANGELOG" | sh scripts/release-notes.sh \
            "${DL}/luci-app-treadle-${VERSION}-r${RELEASE}.apk" \
            "${DL}/luci-app-treadle_${VERSION}-r${RELEASE}_all.ipk" \
            > "$NOTES_FILE"
          gh release create "$TAG" \
            dist/*.apk dist/*.apk.sha256 \
            dist/*.ipk dist/*.ipk.sha256 \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --notes-file "$NOTES_FILE" \
            --latest

  # The feed is the newest release only, indexed and signed (scripts/feed.sh).
  # It downloads the release just created, so it serves the release assets
  # byte for byte. A dry run creates no release and indexes the latest
  # existing one instead.
  feed:
    needs: [version, release]
    runs-on: ubuntu-24.04
    permissions:
      contents: read   # download the release
      pages: read      # the site's URL
    env:
      DRY_RUN: ${{ github.event_name != 'push' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install apk-tools
        uses: ./.github/actions/install-apk-tools

      - name: Install usign
        uses: ./.github/actions/install-usign

      - name: Materialise signing keys
        env:
          APK_SIGN_KEY: ${{ secrets.APK_SIGN_KEY }}
          OPKG_SIGN_KEY: ${{ secrets.OPKG_SIGN_KEY }}
        run: |
          [ -n "$APK_SIGN_KEY" ]  || { echo "::error::APK_SIGN_KEY secret is empty"; exit 1; }
          [ -n "$OPKG_SIGN_KEY" ] || { echo "::error::OPKG_SIGN_KEY secret is empty"; exit 1; }
          install -d -m 700 "$RUNNER_TEMP/keys"
          printf '%s\n' "$APK_SIGN_KEY"  > "$RUNNER_TEMP/keys/apk.ec"
          printf '%s\n' "$OPKG_SIGN_KEY" > "$RUNNER_TEMP/keys/usign.sec"
          chmod 600 "$RUNNER_TEMP/keys/apk.ec" "$RUNNER_TEMP/keys/usign.sec"

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Build the feed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FEED_TAG: ${{ env.DRY_RUN != 'true' && needs.version.outputs.tag || '' }}
          FEED_OUT: ${{ github.workspace }}/public
          APK_SIGN_KEY_FILE: ${{ runner.temp }}/keys/apk.ec
          OPKG_SIGN_KEY_FILE: ${{ runner.temp }}/keys/usign.sec
          PAGES_URL: ${{ steps.pages.outputs.base_url }}
        run: scripts/feed.sh

      - name: Upload the Pages artifact
        if: env.DRY_RUN != 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: public

      - name: Keep the site (dry run)
        if: env.DRY_RUN == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pages-dry-run
          path: public

  # The github-pages environment admits main, the ref this runs on.
  deploy:
    needs: feed
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    # One deploy at a time, and never cut off: a newer one waits its turn.
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
