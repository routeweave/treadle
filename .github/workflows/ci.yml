name: CI

# Every pull request and every push to main runs the checks in test.yml, on
# OpenWrt 25.12 and against an upstream sing-box. Each run keeps its packages
# as an artifact for 30 days (scripts/push-to-router.sh installs the newest
# one of a branch).
#
# Every push to main that passes then publishes the site on GitHub Pages: the
# package feed (the newest release) and, under snapshot/, this run's own
# packages at fixed names, signed, to download and try once. One run per
# commit is the only deploy of that commit, so no two deploys of a commit can
# race (Pages keeps the first one of a commit).
#
# A push to main is also how a release happens. The Makefile's PKG_VERSION /
# PKG_RELEASE name the version most recently released, so when they name a
# version that has no v* tag yet, this commit is a release commit. The run
# then:
#   test     builds and tests that version (release: true), on 24.10 as well;
#   release  signs the apk those tests installed and creates the tag and the
#            release on this commit;
#   feed     indexes and signs that release as the package feed, and serves
#            the same packages as the snapshot;
#   deploy   publishes the site.
#
# Run by hand with release_dry_run, it does all of that for the Makefile's
# version except publishing: the signed packages and the site (its feed
# built from the latest existing release) are kept as artifacts. That is how
# to test the release path on a branch.
#
# Pull requests cancel their own superseded runs. Runs on main queue
# instead: one may be releasing, and a release is never cut off halfway.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_dry_run:
        description: Build, test and sign the Makefile's version as a release, without publishing
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # tag is empty unless this run builds a release. The version is read from
  # the Makefile only: a tag is never the input, it is what a release creates.
  version:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.ver.outputs.tag }}
      version: ${{ steps.ver.outputs.version }}
      release: ${{ steps.ver.outputs.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Is this a release?
        id: ver
        env:
          EVENT: ${{ github.event_name }}
          DRY_RUN: ${{ inputs.release_dry_run }}
        run: sh scripts/decide-release.sh

  test:
    needs: version
    uses: ./.github/workflows/test.yml
    permissions:
      contents: read
      packages: read   # the test images
    with:
      release: ${{ needs.version.outputs.tag != '' }}
      # 24.10 is tested when it ships: on a release (and its dry run) and in
      # the weekly run. It is the only test of opkg and of the oldest
      # supported sing-box, which only 24.10 users run.
      primary_only: ${{ needs.version.outputs.tag == '' }}

  release:
    needs: [version, test]
    if: needs.version.outputs.tag != ''
    runs-on: ubuntu-24.04
    permissions:
      contents: write   # create the tag and the release
    env:
      DRY_RUN: ${{ github.event_name != 'push' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install apk-tools
        uses: ./.github/actions/install-apk-tools

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: packages-${{ github.sha }}
          path: dist/

      - name: Check the tested packages carry the release version
        env:
          FULL_VERSION: ${{ needs.version.outputs.version }}-r${{ needs.version.outputs.release }}
        run: |
          ls -l dist/
          for f in "dist/luci-app-treadle-${FULL_VERSION}.apk" \
                   "dist/luci-app-treadle_${FULL_VERSION}_all.ipk"; do
            [ -f "$f" ] || { echo "::error::$f is missing from the tested build"; exit 1; }
          done

      # The apk is signed with the feed key here, so the release asset and the
      # package the feed serves are the same bytes. --allow-untrusted: the
      # runner has no /etc/apk/keys, so apk cannot verify the signature it is
      # itself applying. Routers verify it.
      - name: Sign the apk with the feed key
        env:
          APK_SIGN_KEY: ${{ secrets.APK_SIGN_KEY }}
        run: |
          [ -n "$APK_SIGN_KEY" ] || { echo "::error::APK_SIGN_KEY secret is empty"; exit 1; }
          install -d -m 700 "$RUNNER_TEMP/keys"
          printf '%s\n' "$APK_SIGN_KEY" > "$RUNNER_TEMP/keys/apk.ec"
          chmod 600 "$RUNNER_TEMP/keys/apk.ec"
          ( cd dist && apk --allow-untrusted adbsign --sign-key "$RUNNER_TEMP/keys/apk.ec" ./*.apk )
          rm -rf "$RUNNER_TEMP/keys"
          for f in dist/*.apk; do sha256sum "$f" | awk '{print $1}' > "$f.sha256"; done

      - name: Keep the signed packages (dry run)
        if: env.DRY_RUN == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-dry-run
          path: dist/
          if-no-files-found: error

      # gh release create makes the tag on this commit together with the
      # release. Releases are immutable here, so creating one that exists
      # fails instead of touching it.
      - name: Publish the GitHub release
        if: env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.version.outputs.tag }}
          VERSION: ${{ needs.version.outputs.version }}
          RELEASE: ${{ needs.version.outputs.release }}
        run: |
          NOTES_FILE=$(mktemp)
          DL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}"
          # GitHub's own "What's Changed" list first, then the install
          # commands. The tag does not exist yet, so the notes are asked for
          # against this commit. A first release has nothing to diff against,
          # so fall back to a bare header rather than lose the commands.
          CHANGELOG=$(gh api -X POST \
            "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            -f tag_name="$TAG" -f target_commitish="$GITHUB_SHA" \
            --jq .body 2>/dev/null) || CHANGELOG=""
          [ -n "$CHANGELOG" ] || CHANGELOG="Release $TAG"
          printf '%s\n' "$CHANGELOG" | sh scripts/release-notes.sh \
            "${DL}/luci-app-treadle-${VERSION}-r${RELEASE}.apk" \
            "${DL}/luci-app-treadle_${VERSION}-r${RELEASE}_all.ipk" \
            > "$NOTES_FILE"
          gh release create "$TAG" \
            dist/*.apk dist/*.apk.sha256 \
            dist/*.ipk dist/*.ipk.sha256 \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --notes-file "$NOTES_FILE" \
            --latest

  # The site: the feed is the newest release only, indexed and signed
  # (scripts/feed.sh). It downloads the release, so it serves the release
  # assets byte for byte; a dry run creates no release and indexes the latest
  # existing one. snapshot/ holds this run's packages at fixed names: on a
  # release commit the release's own, otherwise packages-<sha> with the apk
  # signed here.
  feed:
    needs: [version, test, release]
    if: >-
      !cancelled() && needs.test.result == 'success' && needs.release.result != 'failure'
      && (github.event_name == 'push' && github.ref == 'refs/heads/main' || needs.release.result == 'success')
    runs-on: ubuntu-24.04
    permissions:
      contents: read   # download the release and this run's packages
      actions: read
      pages: read      # the site's URL
    env:
      DRY_RUN: ${{ github.event_name != 'push' }}
      RELEASED: ${{ github.event_name == 'push' && needs.version.outputs.tag != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install apk-tools
        uses: ./.github/actions/install-apk-tools

      - name: Install usign
        uses: ./.github/actions/install-usign

      - name: Materialise signing keys
        env:
          APK_SIGN_KEY: ${{ secrets.APK_SIGN_KEY }}
          OPKG_SIGN_KEY: ${{ secrets.OPKG_SIGN_KEY }}
        run: |
          [ -n "$APK_SIGN_KEY" ]  || { echo "::error::APK_SIGN_KEY secret is empty"; exit 1; }
          [ -n "$OPKG_SIGN_KEY" ] || { echo "::error::OPKG_SIGN_KEY secret is empty"; exit 1; }
          install -d -m 700 "$RUNNER_TEMP/keys"
          printf '%s\n' "$APK_SIGN_KEY"  > "$RUNNER_TEMP/keys/apk.ec"
          printf '%s\n' "$OPKG_SIGN_KEY" > "$RUNNER_TEMP/keys/usign.sec"
          chmod 600 "$RUNNER_TEMP/keys/apk.ec" "$RUNNER_TEMP/keys/usign.sec"

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Build the feed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FEED_TAG: ${{ env.RELEASED == 'true' && needs.version.outputs.tag || '' }}
          FEED_OUT: ${{ github.workspace }}/public
          APK_SIGN_KEY_FILE: ${{ runner.temp }}/keys/apk.ec
          OPKG_SIGN_KEY_FILE: ${{ runner.temp }}/keys/usign.sec
          PAGES_URL: ${{ steps.pages.outputs.base_url }}
        run: scripts/feed.sh

      - name: Take this run's packages
        if: env.RELEASED != 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: packages-${{ github.sha }}
          path: ${{ runner.temp }}/snapshot

      # A release commit's snapshot is the release itself: signing the same
      # package again would give a second file with the same version.
      - name: Add the snapshot
        run: |
          snap="$RUNNER_TEMP/snapshot"
          if [ "$RELEASED" = true ]; then
            mkdir -p "$snap"
            cp public/apk/*.apk public/opkg/*.ipk "$snap/"
          else
            ( cd "$snap" && apk --allow-untrusted adbsign --sign-key "$RUNNER_TEMP/keys/apk.ec" ./*.apk )
          fi
          mkdir -p public/snapshot
          cp "$snap"/*.apk public/snapshot/luci-app-treadle-snapshot.apk
          cp "$snap"/*.ipk public/snapshot/luci-app-treadle-snapshot.ipk
          ls -l public/snapshot

      - name: Upload the Pages artifact
        if: env.DRY_RUN != 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: public

      - name: Keep the site (dry run)
        if: env.DRY_RUN == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pages-dry-run
          path: public

  # The github-pages environment admits main, the ref this runs on. The
  # condition names feed's result itself: the implicit success() also counts
  # the release job feed depends on, which a normal push skips.
  deploy:
    needs: feed
    if: >-
      !cancelled() && needs.feed.result == 'success'
      && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    # One deploy at a time, and never cut off: a newer one waits its turn.
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
