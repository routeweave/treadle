name: Test images

# Builds the test images (tests/image/): each tested OpenWrt release with
# Treadle's dependencies and the tests' own packages preinstalled, pushed to
# ghcr.io/<owner>/treadle-test:<release>. test.yml runs on them, so a CI run
# downloads nothing from the OpenWrt mirrors; without one it falls back to
# the plain OpenWrt image and a full install.
#
# Rebuilt weekly, so the images follow the feeds' package updates, and
# whenever what goes into them changes on main. A pull request that changes
# them builds without pushing. Only main pushes images.
#
# The Makefile is an input for its dependency lists, but most edits to it are
# a release commit's version bump, which changes nothing in an image. A push
# that touches only the Makefile rebuilds when something other than
# PKG_VERSION / PKG_RELEASE or a comment changed. A pull request does not
# watch the Makefile at all: a new dependency already installs from the
# feeds in its test run (tests/install.sh) until main rebuilds the image.

on:
  schedule:
    - cron: '17 3 * * 1'   # Mondays, 03:17 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - tests/image/**
      - tests/install.sh
      - Makefile
      - .github/workflows/test-images.yml
  pull_request:
    paths:
      - tests/image/**
      - tests/install.sh
      - .github/workflows/test-images.yml

permissions:
  contents: read

jobs:
  changes:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    outputs:
      build: ${{ steps.diff.outputs.build }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # the push's first commit may be far below HEAD

      - name: Does this push change what goes into an image?
        id: diff
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          # A new branch or a force push has no usable "before": rebuild.
          if ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            echo "no previous commit to compare with; rebuilding"
            echo "build=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          files=$(git diff --name-only "$BEFORE" HEAD -- \
            tests/image tests/install.sh Makefile .github/workflows/test-images.yml)
          deps() {
            git show "$1:Makefile" | grep -vE '^[[:space:]]*#|^PKG_(VERSION|RELEASE):='
          }
          if [ "$files" = Makefile ] && [ "$(deps "$BEFORE")" = "$(deps HEAD)" ]; then
            echo "::notice::only the Makefile's version or comments changed; the images stay as they are"
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            printf 'changed:\n%s\n' "$files"
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

  image:
    needs: changes
    # changes runs on pushes only; the schedule, a run by hand and a pull
    # request always build.
    if: ${{ !cancelled() && needs.changes.result != 'failure' && needs.changes.outputs.build != 'false' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        # The same strings as test.yml's matrix; the tag is the part after
        # the colon.
        image:
          - openwrt/rootfs:x86_64-25.12.5
          - openwrt/rootfs:x86_64-v24.10.8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build
        env:
          BASE: ${{ matrix.image }}
        run: |
          tag="ghcr.io/${GITHUB_REPOSITORY_OWNER}/treadle-test:${BASE#openwrt/rootfs:}"
          docker build -f tests/image/Dockerfile --build-arg BASE="$BASE" -t "$tag" .
          echo "TAG=$tag" >> "$GITHUB_ENV"

      - name: Push
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push "$TAG"
