name: Feed

# Publishes the Treadle package feed to GitHub Pages — an OpenWrt-style
# repository routers can add and then install/upgrade from — together with
# the rolling snapshot of main under snapshot/. Every run rebuilds the whole
# site: the feed from every v* release, and the snapshot.
#
# Called directly, never chained through workflow_run:
#   - by ci.yml after a push to main passes, with snapshot: true, so the
#     snapshot is the packages that same run just tested;
#   - by release.yml after a release is created; the snapshot stays as the
#     live site serves it.
# Run by hand it rebuilds the site the same way; with dry_run it uploads the
# site as an artifact instead of deploying, which is how to test this
# workflow on a branch.
#
# The snapshot lives here rather than on a GitHub release because releases
# are immutable in this repository: a published release's files can never be
# replaced, and a rolling snapshot is by definition a file that changes.
#
# The github-pages environment admits main and v* tags, the refs its two
# callers run on. A branch gets as far as a dry run.
#
# One-time setup (see README "Install from the Treadle feed"):
#   - run scripts/feed-keygen.sh, commit feed/keys/*.pub
#   - add repo secrets OPKG_SIGN_KEY and APK_SIGN_KEY
#   - enable Pages with Source = GitHub Actions

on:
  workflow_call:
    inputs:
      snapshot:
        description: Publish this run's packages-<sha> artifact as the snapshot
        type: boolean
        default: false
      dry_run:
        description: Build the site and upload it as an artifact, without deploying
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build the site and upload it as an artifact, without deploying
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    # No environment here: github-pages only admits main and v* tags, and a
    # dry run from a branch must get as far as building the site. Only deploy
    # binds it.
    permissions:
      contents: read
      actions: read   # download this run's packages
      pages: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install apk-tools
        uses: ./.github/actions/install-apk-tools

      - name: Install usign
        uses: ./.github/actions/install-usign

      - name: Materialise signing keys
        env:
          APK_SIGN_KEY: ${{ secrets.APK_SIGN_KEY }}
          OPKG_SIGN_KEY: ${{ secrets.OPKG_SIGN_KEY }}
        run: |
          [ -n "$APK_SIGN_KEY" ]     || { echo "APK_SIGN_KEY secret is empty"; exit 1; }
          [ -n "$OPKG_SIGN_KEY" ] || { echo "OPKG_SIGN_KEY secret is empty"; exit 1; }
          install -d -m 700 "$RUNNER_TEMP/keys"
          printf '%s\n' "$APK_SIGN_KEY"     > "$RUNNER_TEMP/keys/apk.rsa"
          printf '%s\n' "$OPKG_SIGN_KEY" > "$RUNNER_TEMP/keys/usign.sec"
          chmod 600 "$RUNNER_TEMP/keys/apk.rsa" "$RUNNER_TEMP/keys/usign.sec"

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Build feed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FEED_OUT: ${{ github.workspace }}/public
          APK_SIGN_KEY_FILE: ${{ runner.temp }}/keys/apk.rsa
          OPKG_SIGN_KEY_FILE: ${{ runner.temp }}/keys/usign.sec
          PAGES_URL: ${{ steps.pages.outputs.base_url }}
        run: scripts/feed.sh

      - name: Take this run's packages for the snapshot
        if: ${{ inputs.snapshot }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: packages-${{ github.sha }}
          path: ${{ runner.temp }}/snapshot

      # snapshot/: this run's packages when it is a main build, otherwise
      # what the live site serves now (see pages-snapshot.sh).
      - name: Add the snapshot of main
        env:
          FEED_OUT: ${{ github.workspace }}/public
          PAGES_URL: ${{ steps.pages.outputs.base_url }}
          SNAPSHOT_DIR: ${{ inputs.snapshot && format('{0}/snapshot', runner.temp) || '' }}
          SNAPSHOT_COMMIT: ${{ github.sha }}
        run: scripts/pages-snapshot.sh

      - name: Upload Pages artifact
        if: ${{ !inputs.dry_run }}
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: public

      - name: Upload the site for inspection (dry run)
        if: ${{ inputs.dry_run }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pages-dry-run
          path: public

  deploy:
    needs: build
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-24.04
    # One deploy at a time, and never cut off: a newer one waits its turn.
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
