name: Feed

# Publishes the Treadle package feed to GitHub Pages — an OpenWrt-style
# repository routers can add and then install/upgrade from — together with
# the rolling snapshot of main under snapshot/. Every run rebuilds the whole
# site: the feed from every v* release, and the snapshot.
#
# Called directly, never chained through workflow_run:
#   - by ci.yml after a push to main passes, with snapshot: true, so the
#     snapshot is the packages that same run just tested;
#   - by release.yml after a release is created; the snapshot stays as the
#     live site serves it.
# Run by hand it rebuilds the site the same way; with dry_run it uploads the
# site as an artifact instead of deploying, which is how to test this
# workflow on a branch.
#
# GitHub Pages identifies a deployment by its commit (deploy-pages sends
# GITHUB_SHA as pages_build_version): a second deploy of a commit made
# minutes after the first reports success and leaves the first one live.
# ci.yml therefore leaves a release commit to its release. A deploy is also skipped when a release
# appeared after its build collected the feed (that release's deploy has
# it), and is checked against the live site afterwards (deploy-id.txt,
# written by the build), since GitHub's "success" does not say which deploy
# the site serves.
#
# The snapshot lives here rather than on a GitHub release because releases
# are immutable in this repository: a published release's files can never be
# replaced, and a rolling snapshot is by definition a file that changes.
#
# The github-pages environment admits main and v* tags, the refs its two
# callers run on. A branch gets as far as a dry run.
#
# One-time setup (see README "Install from the Treadle feed"):
#   - run scripts/feed-keygen.sh, commit feed/keys/*.pub
#   - add repo secrets OPKG_SIGN_KEY and APK_SIGN_KEY
#   - enable Pages with Source = GitHub Actions

on:
  workflow_call:
    inputs:
      snapshot:
        description: Publish this run's packages-<sha> artifact as the snapshot
        type: boolean
        default: false
      dry_run:
        description: Build the site and upload it as an artifact, without deploying
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build the site and upload it as an artifact, without deploying
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    # No environment here: github-pages only admits main and v* tags, and a
    # dry run from a branch must get as far as building the site. Only deploy
    # binds it.
    outputs:
      deploy_id: ${{ steps.stamp.outputs.deploy_id }}
      releases: ${{ steps.stamp.outputs.releases }}
    permissions:
      contents: read
      actions: read   # download this run's packages
      pages: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install apk-tools
        uses: ./.github/actions/install-apk-tools

      - name: Install usign
        uses: ./.github/actions/install-usign

      - name: Materialise signing keys
        env:
          APK_SIGN_KEY: ${{ secrets.APK_SIGN_KEY }}
          OPKG_SIGN_KEY: ${{ secrets.OPKG_SIGN_KEY }}
        run: |
          [ -n "$APK_SIGN_KEY" ]     || { echo "APK_SIGN_KEY secret is empty"; exit 1; }
          [ -n "$OPKG_SIGN_KEY" ] || { echo "OPKG_SIGN_KEY secret is empty"; exit 1; }
          install -d -m 700 "$RUNNER_TEMP/keys"
          printf '%s\n' "$APK_SIGN_KEY"     > "$RUNNER_TEMP/keys/apk.rsa"
          printf '%s\n' "$OPKG_SIGN_KEY" > "$RUNNER_TEMP/keys/usign.sec"
          chmod 600 "$RUNNER_TEMP/keys/apk.rsa" "$RUNNER_TEMP/keys/usign.sec"

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Build feed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FEED_OUT: ${{ github.workspace }}/public
          APK_SIGN_KEY_FILE: ${{ runner.temp }}/keys/apk.rsa
          OPKG_SIGN_KEY_FILE: ${{ runner.temp }}/keys/usign.sec
          PAGES_URL: ${{ steps.pages.outputs.base_url }}
        run: scripts/feed.sh

      - name: Take this run's packages for the snapshot
        if: ${{ inputs.snapshot }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: packages-${{ github.sha }}
          path: ${{ runner.temp }}/snapshot

      # snapshot/: this run's packages when it is a main build, otherwise
      # what the live site serves now (see pages-snapshot.sh).
      - name: Add the snapshot of main
        env:
          FEED_OUT: ${{ github.workspace }}/public
          PAGES_URL: ${{ steps.pages.outputs.base_url }}
          SNAPSHOT_DIR: ${{ inputs.snapshot && format('{0}/snapshot', runner.temp) || '' }}
          SNAPSHOT_COMMIT: ${{ github.sha }}
        run: scripts/pages-snapshot.sh

      # Lets deploy check that the live site is this run's build, and not
      # only that GitHub accepted it (scripts/pages-verify.sh), and that no
      # release appeared after this build collected the feed.
      - name: Stamp the site with this run
        id: stamp
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          id="$GITHUB_RUN_ID.$GITHUB_RUN_ATTEMPT"
          printf '%s\n' "$id" > public/deploy-id.txt
          echo "deploy_id=$id" >> "$GITHUB_OUTPUT"
          echo "releases=$(gh release list --limit 1000 --json tagName -q '.[].tagName' | sort | tr '\n' ' ')" >> "$GITHUB_OUTPUT"

      - name: Upload Pages artifact
        if: ${{ !inputs.dry_run }}
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: public

      - name: Upload the site for inspection (dry run)
        if: ${{ inputs.dry_run }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pages-dry-run
          path: public

  deploy:
    needs: build
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-24.04
    # One deploy at a time, and never cut off: a newer one waits its turn.
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    permissions:
      contents: read   # the verify script and the release list
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: scripts/pages-verify.sh
          sparse-checkout-cone-mode: false

      # On a release, main's CI builds the site from the same commit at the
      # same time. If the release was created after that build collected the
      # feed, deploying it would replace the release's feed with one that
      # lacks the release; that release's own deploy publishes the feed.
      - name: Check no release appeared since the build
        id: fresh
        env:
          GH_TOKEN: ${{ github.token }}
          BUILT_WITH: ${{ needs.build.outputs.releases }}
        run: |
          now=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 1000 --json tagName -q '.[].tagName' | sort | tr '\n' ' ')
          if [ "$now" != "$BUILT_WITH" ]; then
            echo "::notice::a release appeared after this site was built; its own deploy publishes the feed, so this one is skipped"
            echo "stale=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy to GitHub Pages
        id: deploy
        if: ${{ steps.fresh.outputs.stale != 'true' }}
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

      # deploy-pages reports success once GitHub accepts the deployment, also
      # for a repeat of a commit deployed minutes before, which leaves the
      # earlier one live, and deploying again here would repeat it once more.
      # Check the site itself and fail if it is not this run's.
      - name: Check the site serves this deploy
        if: ${{ steps.fresh.outputs.stale != 'true' }}
        env:
          SITE: ${{ steps.deploy.outputs.page_url }}
          DEPLOY_ID: ${{ needs.build.outputs.deploy_id }}
        run: |
          scripts/pages-verify.sh "$SITE" "$DEPLOY_ID" || {
            echo "::error::the site does not serve this deploy; another deploy of this commit may be live (see the header); a push to main deploys a new commit"
            exit 1
          }
