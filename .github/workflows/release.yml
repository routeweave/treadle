name: Release

# Publishes a release from packages that have already been built and tested.
# Reusable only: ci.yml calls it on a release commit, a push to main whose
# Makefile names a version with no v* tag yet, after test.yml has built and
# tested that version in the same run (see ci.yml). So what ships is what the
# smoke tests installed, and a release commit that fails them publishes
# nothing.
#
# The .apk is signed here with the feed key, so the release asset and the
# package the feed serves are the same bytes with the same checksum.
#
# gh release create makes the tag on the tested commit together with the
# release; nothing pushes a tag by hand. Releases are immutable in this
# repository, so a release that already exists is never touched: creating
# it again fails instead.
#
# With dry_run it signs and keeps the packages as an artifact, and creates
# nothing.

on:
  workflow_call:
    inputs:
      tag:
        description: The release's tag, v<PKG_VERSION>
        type: string
        required: true
      version:
        description: PKG_VERSION being released
        type: string
        required: true
      release:
        description: PKG_RELEASE being released
        type: string
        required: true
      dry_run:
        description: Sign and keep the packages as an artifact, without publishing
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    permissions:
      contents: write   # create the GitHub release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install apk-tools
        uses: ./.github/actions/install-apk-tools

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: packages-${{ github.sha }}
          path: dist/

      - name: Check the tested packages carry the release version
        env:
          FULL_VERSION: ${{ inputs.version }}-r${{ inputs.release }}
        run: |
          ls -l dist/
          for f in "dist/luci-app-treadle-${FULL_VERSION}.apk" \
                   "dist/luci-app-treadle_${FULL_VERSION}_all.ipk"; do
            [ -f "$f" ] || { echo "::error::$f is missing from the tested build"; exit 1; }
          done

      # --allow-untrusted: the runner has no /etc/apk/keys, so apk cannot
      # verify the signature it is itself applying. Routers verify it.
      - name: Sign the apk with the feed key
        env:
          APK_SIGN_KEY: ${{ secrets.APK_SIGN_KEY }}
        run: |
          [ -n "$APK_SIGN_KEY" ] || { echo "::error::APK_SIGN_KEY secret is empty"; exit 1; }
          install -d -m 700 "$RUNNER_TEMP/keys"
          printf '%s\n' "$APK_SIGN_KEY" > "$RUNNER_TEMP/keys/apk.ec"
          chmod 600 "$RUNNER_TEMP/keys/apk.ec"
          ( cd dist && apk --allow-untrusted adbsign --sign-key "$RUNNER_TEMP/keys/apk.ec" ./*.apk )
          rm -rf "$RUNNER_TEMP/keys"
          for f in dist/*.apk; do sha256sum "$f" | awk '{print $1}' > "$f.sha256"; done

      - name: Keep the signed packages (dry run)
        if: inputs.dry_run
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-dry-run
          path: dist/
          if-no-files-found: error

      - name: Publish GitHub release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
          VERSION: ${{ inputs.version }}
          RELEASE: ${{ inputs.release }}
        run: |
          NOTES_FILE=$(mktemp)
          DL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}"
          # GitHub's own "What's Changed" list first, then the install
          # commands. The tag does not exist yet, so the notes are asked for
          # against this commit. A first release has nothing to diff against,
          # so fall back to a bare header rather than lose the commands.
          CHANGELOG=$(gh api -X POST \
            "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            -f tag_name="$TAG" -f target_commitish="$GITHUB_SHA" \
            --jq .body 2>/dev/null) || CHANGELOG=""
          [ -n "$CHANGELOG" ] || CHANGELOG="Release $TAG"
          printf '%s\n' "$CHANGELOG" | sh scripts/release-notes.sh \
            "${DL}/luci-app-treadle-${VERSION}-r${RELEASE}.apk" \
            "${DL}/luci-app-treadle_${VERSION}-r${RELEASE}_all.ipk" \
            > "$NOTES_FILE"
          gh release create "$TAG" \
            dist/*.apk dist/*.apk.sha256 \
            dist/*.ipk dist/*.ipk.sha256 \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --notes-file "$NOTES_FILE" \
            --latest
